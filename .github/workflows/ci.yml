name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout openfeature-go
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openfeature-go

      - name: Checkout integration-test-data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          ref: main

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: openfeature-go/go.sum

      - name: Check formatting
        working-directory: openfeature-go
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "Files need gofmt:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        working-directory: openfeature-go
        run: go vet ./...

      - name: Test
        working-directory: openfeature-go
        run: go test -v -race ./...

      # Prove the module still works on the minimum Go it declares. With
      # GOTOOLCHAIN=local a dependency that raises the go directive above 1.25
      # fails here instead of silently forcing consumers onto a newer Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache-dependency-path: openfeature-go/go.sum

      - name: Test (minimum Go 1.25)
        working-directory: openfeature-go
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go build ./...
          go test -race ./...
