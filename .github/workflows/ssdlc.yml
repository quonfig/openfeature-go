# SSDLC PR gate (SOC 2). Copy to .github/workflows/ssdlc.yml in each in-scope
# repo. All logic lives in quonfig/ci; keep this file thin.
name: ssdlc

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read

jobs:
  ssdlc:
    uses: quonfig/ci/.github/workflows/ssdlc.yml@main
    secrets: inherit
